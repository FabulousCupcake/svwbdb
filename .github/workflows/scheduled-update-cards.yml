name: Update card data

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-card-data
  cancel-in-progress: false

jobs:
  update-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Check out master
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Download and compile card data
        run: |
          data/cards/01-download.sh
          data/cards/02-compile.sh

      - name: Commit updated card data
        run: |
          if [[ -z "$(git status --porcelain -- data/cards.json)" ]]; then
              echo "Card data is unchanged."
              exit 0
          fi

          TIMESTAMP="$(date -u '+%Y-%m-%d %H:%M UTC')"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cards.json
          git commit -m "Update card data ($TIMESTAMP)"
          git push origin HEAD:master
