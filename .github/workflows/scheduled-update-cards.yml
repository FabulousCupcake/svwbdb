name: Update game data

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-game-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out master
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Download and compile game data
        run: |
          data/cards/01-download.sh
          data/cards/02-compile.sh
          data/card-sets/01-download.sh
          data/card-sets/02-compile.sh
          data/keywords/01-download.sh
          data/keywords/02-compile.sh
          data/traits/01-download.sh
          data/traits/02-compile.sh

      - name: Commit updated game data
        run: |
          if [[ -z "$(git status --porcelain -- data/cards.json data/card-sets.json data/keywords.json data/traits.json)" ]]; then
              echo "Game data is unchanged."
              exit 0
          fi

          TIMESTAMP="$(date -u '+%Y-%m-%d %H:%M UTC')"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cards.json data/card-sets.json data/keywords.json data/traits.json
          git commit -m "Update game data ($TIMESTAMP)"
          git push origin HEAD:master
